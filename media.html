<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211816"><title>Mirella Glow — Media Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>:root{--dark:#211816;--bg:#f7f0eb;--paper:#fffdfa;--line:#e5d8d0;--muted:#766963;--accent:#a45e56;--gold:#b08a5c;--red:#a44e45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#251c19;font-family:'DM Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(460px,100%);background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:36px;box-shadow:0 25px 80px #2a171014}.brand{font:600 32px 'Playfair Display'}.eyebrow{font-size:9px;color:var(--gold);font-weight:700;letter-spacing:.25em;text-transform:uppercase}.login h1{font:500 48px 'Playfair Display';margin:30px 0 7px}.muted{color:var(--muted);font-size:12px;line-height:1.65}.form{display:grid;gap:13px}.form label,.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.form input,.field input,.field textarea{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:0}.form input:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}.btn{border:1px solid var(--dark);background:var(--dark);color:#fff;padding:11px 16px;border-radius:999px;font-size:11px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.alt{background:#fff;color:var(--dark);border-color:var(--line)}.btn.danger{background:#fff;color:var(--red);border-color:#e3c0bb}.app{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.actions,.row{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:18px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:999px;font-size:11px;font-weight:700}.tab.active{background:var(--dark);color:#fff}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px}.panel h2{font:500 32px 'Playfair Display';margin:0 0 7px}.notice{background:#f5e8e3;border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--muted);font-size:11px;line-height:1.65}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}.media-card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.preview{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#f0e4de}.media-body{padding:15px}.media-body h3{font:500 25px 'Playfair Display';margin:0 0 5px}.field{margin-top:12px}.field textarea{min-height:80px;resize:vertical}.status{min-height:18px;margin-top:12px;font-size:11px}.success{color:#3e7259}.error{color:var(--red)}.empty{text-align:center;padding:45px;color:var(--muted);grid-column:1/-1}.divider{height:1px;background:var(--line);margin:20px 0}@media(max-width:900px){.media-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.app{padding:14px}.top{align-items:flex-start;flex-direction:column}.media-grid{grid-template-columns:1fr}.login-card{padding:25px}.login h1{font-size:40px}}</style></head><body><div id="login" class="login"><section class="login-card"><div class="brand">Mirella Glow</div><div class="eyebrow">Admin Media Studio</div><h1>Control every visual.</h1><p class="muted">Sign in with the same active Firebase admin account used by Admin Studio. This studio controls the visual content shown on the storefront.</p><form id="loginForm" class="form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" id="loginButton">Sign in securely</button><div id="error" class="error"></div></form></section></div><main id="app" class="app hidden"><header class="top"><div><div class="brand">Media Studio</div><div class="muted" id="adminEmail"></div></div><div class="actions"><a class="btn alt" href="admin.html">← Admin Studio</a><a class="btn alt" href="index.html">View Storefront ↗</a><button class="btn" id="logout">Sign out</button></div></header><nav class="tabs"><button class="tab active" data-tab="hero">Hero</button><button class="tab" data-tab="posters">Promotions</button><button class="tab" data-tab="categories">Categories</button><button class="tab" data-tab="editorial">Editorial</button><button class="tab" data-tab="story">Our Story</button><button class="tab" data-tab="videos">Reels / Videos</button><button class="tab" data-tab="announcement">Announcement</button></nav><section id="heroPanel" class="panel"></section><section id="postersPanel" class="panel hidden"></section><section id="categoriesPanel" class="panel hidden"></section><section id="editorialPanel" class="panel hidden"></section><section id="storyPanel" class="panel hidden"></section><section id="videosPanel" class="panel hidden"></section><section id="announcementPanel" class="panel hidden"></section></main><script type="module" src="./media-studio.js"></script></body></html>
