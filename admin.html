<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17110f"><title>Mirella Glow — Admin Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--dark:#17110f;--paper:#fffdfa;--bg:#f5efe9;--line:#e5d9d1;--gold:#b99058;--muted:#776a64;--green:#3e7259;--red:#a64d45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#241b18;font-family:'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:38px;box-shadow:0 25px 80px #2a171010}.logo{font:700 37px 'Cormorant Garamond';text-align:center}.sub{text-align:center;color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;margin-top:-4px}.login h1{font:600 49px 'Cormorant Garamond';margin:35px 0 5px}.muted{color:var(--muted);font-size:13px}.form{display:grid;gap:13px}.form label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.form input,.form select,.form textarea,.toolbar input,.toolbar select{display:block;width:100%;border:1px solid var(--line);background:white;border-radius:10px;padding:12px;margin-top:6px;outline:0}.form textarea{min-height:100px;resize:vertical}.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check{display:flex;align-items:center;gap:8px;text-transform:none!important;letter-spacing:0!important;background:#fff;border:1px solid var(--line);padding:10px;border-radius:10px}.check input{width:auto!important;margin:0!important}.btn{border:1px solid var(--dark);background:var(--dark);color:white;border-radius:10px;padding:12px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.alt{background:white;color:var(--dark);border-color:var(--line)}.btn.danger{border-color:#e5c3be;color:var(--red);background:#fff}.shell{min-height:100vh;display:flex}.side{width:250px;background:var(--dark);color:white;position:fixed;inset:0 auto 0 0;padding:28px 16px}.side .logo{font-size:35px}.side .sub{margin-bottom:38px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cfc2bc;text-align:left;border-radius:11px;padding:13px 15px}.nav button.active,.nav button:hover{background:#2b211d;color:white}.main{margin-left:250px;width:calc(100% - 250px);padding:28px;max-width:1600px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.title{font:600 50px 'Cormorant Garamond';margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:21px}.kpi span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.kpi strong{display:block;font:600 40px 'Cormorant Garamond';margin-top:4px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:21px;margin-top:17px}.panel h2{font:600 31px 'Cormorant Garamond';margin:0 0 18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{min-width:240px;max-width:360px;margin:0}.toolbar select{width:auto;margin:0}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1e7df;font-size:9px;text-transform:uppercase;letter-spacing:.08em}. nForm" class="form"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn">Sign in securely</button><div id="loginError" class="red"></div></form></div></div><div id="app" class="shell hidden"><aside class="side"><div class="logo">Mirella</div><div class="sub">Admin Studio</div><nav class="nav"><button data-view="dashboard" class="active">⌂ <span>Dashboard</span></button><button data-view="orders">▣ <span>Orders</span></button><button data-view="products">◇ <span>Products</span></button><button data-view="storefront">✦ <span>Storefront</span></button><button data-view="settings">⚙ <span>Settings</span></button><button id="logout" style="margin-top:25px">↪ <span>Sign out</span></button></nav></aside><main class="main"><div class="top"><div><div class="muted" id="adminEmail">Mirella Glow</div><h1 class="title" id="title">Dashboard</h1></div><div class="top-actions"><a class="btn alt" href="media.html">Media Studio</a><a class="btn alt" href="index.html">View storefront ↗</a></div></div><div id="content"></div></main></div><div class="modal" id="productModal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">New product</h2><button class="close" id="closeModal">×</button></div><form id="productForm" class="form" style="margin-top:18px"><input type="hidden" id="productId"><label>Product name<input id="pName" required></label><label>Category<select id="pCategory"><option value="skin">Skin</option><option value="hair">Hair</option><option value="body">Body</option><option value="combos">Combos</option></select></label><div class="check-grid"><label class="check"><input id="pNew" type="checkbox"> New Arrival</label><label class="check"><input id="pBest" type="checkbox"> Bestseller</label></div><label>Badge / merchandising label<input id="pBadge" placeholder="New, Bestseller, Limited..." ></label><label>Brand<in
