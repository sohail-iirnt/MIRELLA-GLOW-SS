<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirella Glow — Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--dark:#17110f;--paper:#fffdfa;--bg:#f6f1eb;--line:#e6dcd4;--gold:#b99058;--muted:#756964;--red:#a64d45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#241b18;font-family:'DM Sans',sans-serif}button,input,select,textarea{font:inherit}.shell{min-height:100vh;display:flex}.side{width:245px;background:var(--dark);color:#fff;padding:25px 17px;position:fixed;inset:0 auto 0 0}.logo{font:700 34px 'Cormorant Garamond';text-align:center}.sub{text-align:center;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:#caa36b;margin-bottom:40px}.navbtn{width:100%;padding:12px 14px;background:transparent;color:#d8cbc5;border:0;border-radius:10px;text-align:left;margin:2px 0}.navbtn.active,.navbtn:hover{background:#2b211d;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:30px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.title{font:600 48px 'Cormorant Garamond';margin:0}.muted{color:var(--muted);font-size:13px}.btn{border:1px solid var(--dark);background:var(--dark);color:white;border-radius:10px;padding:11px 16px;font-weight:700}.btn.alt{background:white;color:var(--dark);border-color:var(--line)}.danger{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}.kpi{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.value{font:600 38px 'Cormorant Garamond';margin-top:5px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}.panel h2{font:600 30px 'Cormorant Garamond';margin:0 0 18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 12px;outline:0}.toolbar input{min-width:240px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1e7df;font-size:10px;text-transform:uppercase;letter-spacing:.07em}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form .full{grid-column:1/-1}.form label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;display:grid;gap:6px}.form textarea{min-height:100px;resize:vertical}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 20px 60px #3a251415}.loginbox h1{font:600 50px 'Cormorant Garamond';margin:0}.hidden{display:none!important}.empty{text-align:center;padding:45px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:10}.modal.open{display:grid}.modalbox{background:var(--paper);width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:25px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;font-size:25px}@media(max-width:900px){.side{width:70px}.logo,.sub,.navbtn span{display:none}.navbtn{text-align:center}.main{margin-left:70px;width:calc(100% - 70px)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.main{padding:18px}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .full{grid-column:auto}.table{display:block;overflow:auto}.title{font-size:38px}}
</style></head><body><div id="login" class="login"><div class="loginbox"><div class="logo">Mirella Glow</div><div class="sub">Admin studio</div><h1>Welcome back.</h1><p class="muted">Sign in with the Firebase admin account.</p><form id="loginForm" class="form" style="grid-template-columns:1fr"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn">Sign in</button><div id="loginError" class="danger"></div></form></div></div>
<div id="app" class="hidden"><aside class="side"><div class="logo">Mirella</div><div class="sub">Admin studio</div><button class="navbtn active" data-view="dashboard">⌂ <span>Dashboard</span></button><button class="navbtn" data-view="orders">▣ <span>Orders</span></button><button class="navbtn" data-view="products">◇ <span>Products</span></button><button class="navbtn" data-view="settings">⚙ <span>Settings</span></button><button id="logout" class="navbtn" style="margin-top:30px">↪ <span>Sign out</span></button></aside><main class="main"><div class="top"><div><p class="muted" id="hello">Mirella Glow</p><h1 class="title" id="viewTitle">Dashboard</h1></div><a class="btn alt" href="index.html">View storefront ↗</a></div><div id="content"></div></main></div>
<div id="productModal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="productModalTitle" style="font:600 32px 'Cormorant Garamond';margin:0">New product</h2><button class="close" id="closeProduct">×</button></div><form id="productForm" class="form" style="margin-top:20px"><input type="hidden" id="productId"><label>Name<input id="pName" required></label><label>Category<select id="pCategory"><option value="skin">Skin</option><option value="hair">Hair</option><option value="body">Body</option><option value="combos">Combos</option></select></label><label>Price (₹)<input id="pPrice" type="number" min="0" required></label><label>Stock<input id="pStock" type="number" min="0" required></label><label class="full">Image URL<input id="pImage" placeholder="Paste Firebase Storage download URL"></label><label class="full">Description<textarea id="pDescription"></textarea></label><label><span>Active</span><input id="pActive" type="checkbox" checked></label><div class="full"><button class="btn">Save product</button></div></form></div></div>
<script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let orders=[],products=[],view='dashboard';const $=s=>document.querySelector(s),money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function isAdmin(uid){const r=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js');const snap=await r.getDoc(r.doc(db,'admins',uid));return snap.exists()&&snap.data().active!==false}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await signInWithEmailAndPassword(auth,$('#email').value,$('#password').value)}catch(x){$('#loginError').textContent='Invalid admin credentials or Firebase is not configured.'}};$('#logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,async u=>{if(!u){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}try{if(!(await isAdmin(u.uid)))throw new Error('not-admin');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#hello').textContent=u.email;await load();render()}catch(e){await signOut(auth);$('#loginError').textContent='This account is not registered as an active Mirella admin.'}});
async function load(){const[p,o]=await Promise.all([getDocs(collection(db,'products')),getDocs(collection(db,'orders'))]);products=p.docs.map(d=>({id:d.id,...d.data()}));orders=o.docs.map(d=>({id:d.id,...d.data()}));}
function render(){const title={dashboard:'Dashboard',orders:'Orders',products:'Products',settings:'Settings'}[view];$('#viewTitle').textContent=title;document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='dashboard')dashboard();if(view==='orders')ordersView();if(view==='products')productsView();if(view==='settings')settingsView()}
function dashboard(){const revenue=orders.filter(o=>o.paymentStatus==='paid'||o.paymentMethod==='cod').reduce((a,o)=>a+Number(o.total||0),0);$('#content').innerHTML=`<div class="grid"><div class="card"><div class="kpi">Revenue</div><div class="value">${money(revenue)}</div></div><div class="card"><div class="kpi">Orders</div><div class="value">${orders.length}</div></div><div class="card"><div class="kpi">Pending</div><div class="value">${orders.filter(o=>!['delivered','cancelled'].includes(o.status)).length}</div></div><div class="card"><div class="kpi">Products</div><div class="value">${products.filter(p=>p.active!==false).length}</div></div></div><div class="panel"><h2>Recent orders</h2>${orderTable(orders.slice().sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,8))}</div>`}
function orderTable(arr){if(!arr.length)return'<div class="empty">No orders yet.</div>';return`<table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th></tr></thead><tbody>${arr.map(o=>`<tr><td><b>${o.id.slice(0,10).toUpperCase()}</b></td><td>${esc(o.customer?.name)}<br><span class="muted">${esc(o.customer?.phone)}</span></td><td>${money(o.total)}</td><td><span class="pill">${esc(o.paymentStatus||o.paymentMethod||'pending')}</span></td><td><span class="pill">${esc(o.status||'new')}</span></td><td><select data-order="${o.id}" class="order-status"><option ${o.status==='new'?'selected':''}>new</option><option ${o.status==='confirmed'?'selected':''}>confirmed</option><option ${o.status==='processing'?'selected':''}>processing</option><option ${o.status==='packed'?'selected':''}>packed</option><option ${o.status==='shipped'?'selected':''}>shipped</option><option ${o.status==='delivered'?'selected':''}>delivered</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></td></tr>`).join('')}</tbody></table>`}
function ordersView(){orders.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$('#content').innerHTML=`<div class="panel"><div class="toolbar"><input id="orderSearch" placeholder="Search name, phone or order ID"><select id="orderFilter"><option value="all">All statuses</option><option>new</option><option>confirmed</option><option>processing</option><option>packed</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></div><div id="orderTable">${orderTable(orders)}</div></div>`;$('#orderSearch').oninput=filterOrders;$('#orderFilter').onchange=filterOrders;bindOrderSelects()}
function filterOrders(){const q=$('#orderSearch').value.toLowerCase(),s=$('#orderFilter').value;const a=orders.filter(o=>(s==='all'||o.status===s)&&(`${o.id} ${o.customer?.name||''} ${o.customer?.phone||''}`.toLowerCase().includes(q)));$('#orderTable').innerHTML=orderTable(a);bindOrderSelects()}
function bindOrderSelects(){document.querySelectorAll('.order-status').forEach(x=>x.onchange=async()=>{await updateDoc(doc(db,'orders',x.dataset.order),{status:x.value,updatedAt:serverTimestamp()});await load();render()})}
function productsView(){products.sort((a,b)=>String(a.name).localeCompare(String(b.name)));$('#content').innerHTML=`<div class="panel"><div class="toolbar"><button class="btn" id="newProduct">+ Add product</button><input id="productSearch" placeholder="Search products"></div><div id="productTable"></div></div>`;$('#newProduct').onclick=()=>openProduct();$('#productSearch').oninput=()=>renderProductRows();renderProductRows()}
function renderProductRows(){const q=$('#productSearch').value.toLowerCase();const a=products.filter(p=>String(p.name).toLowerCase().includes(q));$('#productTable').innerHTML=a.length?`<table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr></thead><tbody>${a.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.description||'')}</span></td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${p.stock??0}</td><td>${p.active!==false?'Yes':'No'}</td><td><button class="btn alt" data-edit="${p.id}">Edit</button> <button class="btn alt danger" data-delete="${p.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No products.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openProduct(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeProduct(b.dataset.delete))}
function openProduct(id){const p=products.find(x=>x.id===id);$('#productId').value=p?.id||'';$('#pName').value=p?.name||'';$('#pCategory').value=p?.category||'skin';$('#pPrice').value=p?.price||'';$('#pStock').value=p?.stock||0;$('#pImage').value=p?.imageUrl||'';$('#pDescription').value=p?.description||'';$('#pActive').checked=p?.active!==false;$('#productModalTitle').textContent=p?'Edit product':'New product';$('#productModal').classList.add('open')}
$('#closeProduct').onclick=()=>$('#productModal').classList.remove('open');$('#productForm').onsubmit=async e=>{e.preventDefault();const id=$('#productId').value,data={name:$('#pName').value.trim(),category:$('#pCategory').value,price:Number($('#pPrice').value),stock:Number($('#pStock').value),imageUrl:$('#pImage').value.trim(),description:$('#pDescription').value.trim(),active:$('#pActive').checked,updatedAt:serverTimestamp()};if(id)await updateDoc(doc(db,'products',id),data);else await addDoc(collection(db,'products'),{...data,createdAt:serverTimestamp()});$('#productModal').classList.remove('open');await load();render()};async function removeProduct(id){if(!confirm('Delete this product?'))return;await deleteDoc(doc(db,'products',id));await load();render()}
function settingsView(){$('#content').innerHTML=`<div class="panel"><h2>Store configuration</h2><p class="muted">Firebase Web configuration lives in <b>firebase-config.js</b>. Keep service-account credentials and payment secrets out of the browser.</p><p class="muted">To grant admin access, create a Firestore document at <b>admins/&lt;Firebase Auth UID&gt;</b> with <b>active: true</b>.</p></div><div class="panel"><h2>Recommended payment setup</h2><p class="muted">Razorpay payment creation and signature verification should run in Firebase Cloud Functions. Never expose the Razorpay secret key in index.html or this admin panel.</p></div>`}
document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});</script></body></html>
